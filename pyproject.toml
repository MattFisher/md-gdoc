[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-gdoc"
dynamic = ["version"]
description = "Sync local markdown files with Google Docs: push drafts, pull comments and edits, preserve comment anchors."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matt Fisher", email = "m@ttfisher.com" }]
keywords = ["markdown", "google-docs", "google-drive", "sync", "comments", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Communications :: File Sharing",
]
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    "markdown-it-py>=3.0",
    "mdformat-gfm>=1.0.0",
    "python-frontmatter>=1.0",
]

[project.urls]
Homepage = "https://github.com/MattFisher/md-gdoc"
Repository = "https://github.com/MattFisher/md-gdoc"
Issues = "https://github.com/MattFisher/md-gdoc/issues"
Changelog = "https://github.com/MattFisher/md-gdoc/blob/main/CHANGELOG.md"

[project.scripts]
md-gdoc = "md_gdoc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
<<<<<<< before updating
    "python-dotenv>=1.0",
    "mypy>=1.10",
=======
    "basedpyright>=1.39",
>>>>>>> after updating
    "pre-commit>=4.0.0",
]

[tool.hatch.version]
path = "src/md_gdoc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/md_gdoc"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "D",     # pydocstyle
    "C4",    # flake8-comprehensions
    "PT",    # flake8-pytest-style
    "PIE",   # flake8-pie
    "DTZ",   # flake8-datetimez (timezone-aware datetimes)
    "ISC",   # implicit-str-concat (catches missing commas)
    "ASYNC", # flake8-async
    "N",     # pep8-naming
    "FURB",  # refurb (modernization)
    "RUF",   # ruff-specific rules
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
]
ignore = [
    "E501",   # line-too-long — the formatter owns line length
    "D10",    # missing docstrings — don't force them
    "D415",   # first-line punctuation — the module docstring is the project
    # description, whose punctuation varies
    "ISC001", # single-line implicit concat — conflicts with the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"] # tests don't need docstring linting

[tool.basedpyright]
pythonVersion = "3.10"
# "strict" (pyright's), not basedpyright's stricter default "recommended" —
# the based-only rules (reportAny etc.) are opt-in per project.
typeCheckingMode = "strict"
reportMissingTypeStubs = false # third-party libs are often untyped


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rA --durations=10 --color=yes --cov=src --cov-report=term-missing"
