name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # md-gdoc is published and claims 3.10-3.14 support, so unlike the other
  # repos it matrixes the shared workflow across every supported version
  # (plus one macOS run) rather than calling it once.
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
    uses: MattFisher/python-project-template/.github/workflows/python-ci.yml@v1.5.0
    with:
      python-version: ${{ matrix.python }}
      runs-on: ${{ matrix.os }}
