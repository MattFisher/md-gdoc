name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # md-gdoc is published and claims 3.10-3.14 support, so unlike the other
  # repos it matrixes the shared workflow across every supported version
  # (plus one macOS run) rather than calling it once.
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
    # Moving major tag on purpose (see .github/zizmor.yml): we own this repo,
    # so CI fixes flow in without a bump PR per template release. Dependabot
    # is told to leave it alone in .github/dependabot.yml — don't "helpfully"
    # pin this to an exact version, or copier update will just revert it.
    uses: MattFisher/python-project-template/.github/workflows/python-ci.yml@v1
    with:
      python-version: ${{ matrix.python }}
      runs-on: ${{ matrix.os }}
